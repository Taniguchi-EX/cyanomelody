[workspace]
members = ["src-tauri", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["谷口"]
license = "UNLICENSED"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
