[package]
name = "cyanomelody"
version = "1.1.4"
description = "音声素材の管理アプリ"
authors = ["Taniguchi"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cyanomelody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
dunce = "1"
thiserror = "2"
blake3 = "1"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
encoding_rs = "0.8"
symphonia-metadata = "0.5"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }

[dev-dependencies]
tempfile = "3"
