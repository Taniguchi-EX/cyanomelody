[package]
name = "cyanomelody"
version = "1.3.3"
description = "音声素材の管理アプリ"
authors = ["Taniguchi"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cyanomelody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
dunce = "1"
thiserror = "2"
blake3 = "1"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
encoding_rs = "0.8"
symphonia-metadata = "0.5"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }
ttf-parser = "0.25.1"

# デスクトップ（Windows）だけで使うもの：自動アップデートと、ごみ箱への移動（Android にはない）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
trash = "5"

# Windows：USB でつないだスマホ（MTP）への直接コピー（Windows Portable Devices。windows は winmtp と同じ版にする）
[target.'cfg(windows)'.dependencies]
winmtp = "0.3"
windows = { version = "0.52", features = ["Win32_System_Com", "Win32_Devices_PortableDevices", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation"] }
widestring = "1"

# Android：Storage Access Framework（フォルダの選択・読み取り）と、content:// のファイルを画面に渡すプロトコル、
# ダウンロードした新しい版の APK をインストールの画面に渡す仕組み（file_provider）
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "30", features = ["protocol-content", "file_provider"] }
# 自動アップデート：GitHub の Release の情報を読み、新しい版の APK をダウンロードする
ureq = "3"

[dev-dependencies]
tempfile = "3"
