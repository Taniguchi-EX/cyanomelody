[package]
name = "cyanomelody-core"
description = "cyanomelody の中核（OS に依存しない部分）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["cpal-output"]
# cpal で実際の出力先に音を出す。単体テストでは使わない
cpal-output = ["dep:cpal"]

[dependencies]
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "pcm"] }
rubato = "0.16"
fastrand = "2"
thiserror = "2"
log = "0.4"
cpal = { version = "0.16", optional = true }
lofty = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
urlencoding = "2"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"

[[example]]
name = "play"
required-features = ["cpal-output"]

[[example]]
name = "drive"
required-features = ["cpal-output"]
